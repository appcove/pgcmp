[package]
name = "pgcmp"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Jason Garber <jgarber@appcove.com>"]
description = "PostgreSQL schema comparison and migration testing CLI, built for AI-assisted migration authoring"
repository = "https://github.com/appcove/pgcmp"
homepage = "https://github.com/appcove/pgcmp"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["postgresql", "schema", "migration", "diff", "database"]
categories = ["command-line-utilities", "database"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
toml = "1"
serde = { version = "1", features = ["derive"] }
git2 = "0.21"
anyhow = "1"
console = "0.16.6"
indicatif = "0.18.6"
ratatui = "0.30"
crossterm = "0.29"
tui-input = "0.15"
ratatui-textarea = "0.9"
pg_query = "18"
similar = "3"
